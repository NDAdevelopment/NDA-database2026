name: Validate dental exam library

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile db7559__12_pdf.py
      - name: Check CSV and font assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          csv_path = Path("97_119DB.csv")
          assert csv_path.is_file(), "97_119DB.csv is missing"
          df = pd.read_csv(csv_path, dtype=str, encoding="utf-8-sig")
          assert len(df) > 0, "CSV has no data rows"
          print(f"CSV loaded: {len(df)} rows, {len(df.columns)} columns")
          assert Path("fonts/IPAexGothic.ttf").is_file(), "Japanese font is missing"
          print("Japanese font file found")
          PY
      - name: Smoke-test Streamlit startup
        run: |
          set -e
          streamlit run db7559__12_pdf.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill "$STREAMLIT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              echo
              echo "Streamlit health check passed"
              exit 0
            fi
            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          echo "Streamlit did not become healthy in time"
          exit 1
